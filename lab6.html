<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />

    <title>Lab 6 - Consuming a Rest API</title>
  </head>
  <body>
    <div class="container py-5">
      <nav class="navbar navbar-expand bg-dark rounded mb-4">
        <div class="text-primary">
          <ul class="navbar-nav gap-4">
            <li class="nav-item">
              <a class="nav-link text-white fw-bold" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-bold" href="lab4.html">Store</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-bold" href="lab5.html"
                >Registration</a
              >
            </li>
          </ul>
        </div>
      </nav>

      <header class="display-6 fw-bold mb-4">Consuming a REST API</header>
      <div class="mb-4">
        <button id="load-btn" class="btn btn-primary btn-lg shadow-sm">
          Load Cat Data
        </button>
      </div>
      <div class="row g-4 mb-2">
        <div class="col-lg-5">
          <div class="card shadow-sm h-100">
            <div class="card-header bg-white fw-semibold">Cat Picture</div>
            <div class="align-items-center justify-content-center p-3">
              <img
                id="cat-image"
                src="waiting.gif"
                alt="Cat Display"
                class="img-fluid rounded border object-fit-cover w-100 mh-100"
              />
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="card shadow-sm h-100">
            <div class="card-header bg-white fw-semibold">Cat Facts</div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table
                  class="table table-striped table-hover align-middle mb-0"
                >
                  <thead class="table-dark">
                    <tr>
                      <th scope="col" class="text-start w-25">factId</th>
                      <th scope="col">fact</th>
                    </tr>
                  </thead>
                  <tbody id="facts-table-body">
                    <tr>
                      <td colspan="2" class="text-center text-muted py-4">
                        Click 'Load Cat Data' to fetch facts.
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lab6.js"></script>
  </body>
</html>
