<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <div class="container mt-5" style="max-width: 600px">
      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="lab4.html">Store</a></li>
          <li><a href="lab5.html">Registration</a></li>
        </ul>
      </nav>
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="card-title text-center mb-4">Product Registration</h3>

          <form id="registrationForm">
            <div class="mb-3">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" class="form-control" id="firstName" />
            </div>
            <div class="mb-3">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="lastName" />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" />
            </div>
            <div class="mb-4">
              <label for="dob" class="form-label">Date of Birth</label>
              <input type="date" class="form-control" id="dob" />
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Register
            </button>
          </form>

          <div id="outputArea" class="mt-4"></div>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("registrationForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const outputArea = document.getElementById("outputArea");

          const firstName = document.getElementById("firstName").value.trim();
          const lastName = document.getElementById("lastName").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const dob = document.getElementById("dob").value;

          if (!firstName || !lastName || !email || !password || !dob) {
            outputArea.innerHTML = `<div class="alert alert-danger">Registration failed: All fields must be present.</div>`;
            return;
          }

          if (!password.includes("!") && !password.includes("?")) {
            outputArea.innerHTML = `<div class="alert alert-danger">Registration failed: Password must contain a special character (! or ?).</div>`;
            return;
          }

          const user = {
            firstName: firstName,
            lastName: lastName,
            email: email,
            password: password,
            dob: dob,
          };

          user.password = "*".repeat(user.password.length);

          outputArea.innerHTML = `
        <div class="alert alert-success">
            <h5>Registration Successful</h5>
            <hr>
            <p class="mb-1"><strong>First Name:</strong> ${user.firstName}</p>
            <p class="mb-1"><strong>Last Name:</strong> ${user.lastName}</p>
            <p class="mb-1"><strong>Email:</strong> ${user.email}</p>
            <p class="mb-1"><strong>Password:</strong> ${user.password}</p>
            <p class="mb-0"><strong>Date of Birth:</strong> ${user.dob}</p>
        </div>
    `;
        });
    </script>
  </body>
</html>
